[build]
  command = "git submodule update --init --recursive && npm install && node scripts/fetch-wcag-data.js"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**", "data/**"]

[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
